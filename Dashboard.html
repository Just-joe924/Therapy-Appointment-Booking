<body>
    <header>
        <nav class="nav-bar">
            <a id="logo" href="./Home.html">Inki-J</a>

                <li><a href="./Home.html">Home</a></li>

                <li><button onclick="logout()">Log out</button></a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="booking-section">
            <h1>Book an Appointment</h1>

            <div class="booking-grid">
                <form id="booking-form" class="booking-form" aria-label="Book an appointment">
                    <label>
                        Full name
                        <input type="text" id="fullName" required />
                    </label>

                    <label>
                        Email
                        <input type="email" id="email" required />
                    </label>

                    <label>
                        Phone
                        <input type="tel" id="phone" />
                    </label>

                    <label>
                        Service
                        <select id="service" required></select>
                    </label>

                    <label>
                        Therapist
                        <select id="therapist" required></select>
                    </label>

                    <label>
                        Date
                        <input type="date" id="date" required />
                    </label>

                    <label>
                        Time
                        <input type="time" id="time" required />
                    </label>

                    <label>
                        Notes
                        <textarea id="notes" rows="3"></textarea>
                    </label>

                    <div class="form-actions">
                        <button type="submit">Reserve</button>
                        <button type="reset">Clear</button>
                    </div>

                    <div id="form-message" role="status" aria-live="polite"></div>
                </form>

                <aside class="booking-list">
                    <h2>Your Appointments</h2>
                    <div id="appointments-container">No appointments yet.</div>
                </aside>
            </div>
        </section>
        
    </main>
